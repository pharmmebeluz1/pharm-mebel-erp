<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mebel360° — Qo‘llab-quvvatlash</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="phone-page">
<div class="screen">
  <header class="top">
    <a class="back" href="{{ url_for('rate_order', order_code=order.order_code) }}">‹</a>
    <div>
      <div class="small-muted">Murojaat sanasi</div>
      <div class="visit">{{ order.visit_at }}</div>
    </div>
    <div class="spacer"></div>
  </header>

  <main class="rating-main">
    <div class="logo">Mebel360°</div>
    <h1>Qo‘llab-quvvatlash markazi</h1>
    <p class="sub">Sizga qanday yordam bera olamiz?</p>

    <form method="post">
      <div class="support-grid">
        {% for key,label in topics %}
        <label class="support-card">
          <input type="radio" name="topic" value="{{ key }}" {% if loop.first %}checked{% endif %}>
          <span class="support-icon">{{ ["☷","▣","▰","⚒","◌","◉"][loop.index0] }}</span>
          <span>{{ label }}</span>
        </label>
        {% endfor %}
      </div>

      <div class="comment-wrap">
        <textarea name="message" maxlength="500" required placeholder="Muammoingizni yozing"></textarea>
        <div class="counter">0/500</div>
      </div>

      <a class="call-btn" href="tel:+998000000000">☎ Call-markazga qo‘ng‘iroq</a>
      <button type="submit" class="primary-btn">Qo‘llab-quvvatlash markaziga murojaat</button>
    </form>

    <div class="admin-links">
      <a href="{{ url_for('support_admin') }}">Rahbar: murojaatlar</a>
    </div>
  </main>
</div>
</body>
</html>
